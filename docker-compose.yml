version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hr_bot_db
    environment:
      POSTGRES_USER: hrbot
      POSTGRES_PASSWORD: hrpassword
      POSTGRES_DB: hrbot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hr_bot_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
