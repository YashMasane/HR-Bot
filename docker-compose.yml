version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hr_bot_db
    environment:
      POSTGRES_USER: hrbot
      POSTGRES_PASSWORD: hrpassword
      POSTGRES_DB: hrbot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hr_bot_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hr_bot_worker
    env_file:
      - .env
    environment:
      # .env's POSTGRES_SERVER/PORT and REDIS_HOST/PORT point at localhost +
      # the host-mapped ports (5433/6380) for the app running outside Docker.
      # From inside this container, "localhost" would mean the container
      # itself - these override to the real service names/ports on the
      # compose network instead.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
